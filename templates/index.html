<!DOCTYPE html>
<html>
<head>
    <title>Eorzea Market Explorer</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <h1>Eorzea Market Explorer</h1>

    <div class="container">
        <div class="container-item">
            <form action="/search" method="get">
                <input type="text" id="input-query" name="input-query" placeholder="Search for an item...">
            </form>
        </div>
        <div class="container-item">
            <input type="submit" id="submit-button" value="Submit">
        </div>
        <div class="container-item">
            <select name="world" id="world">
                <option value="Aether">Aether</option>
                <option value="Leviathan">Leviathan</option>
            </select>
        </div>
        {% if searched_item %}
            <div class="container-item">
                <p>You searched for: {{searched_item}}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
